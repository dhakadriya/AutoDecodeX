services:
  - type: web
    name: autodecodex-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ENV
        value: production
    healthCheckPath: /health
    autoDeploy: true
    plan: free
